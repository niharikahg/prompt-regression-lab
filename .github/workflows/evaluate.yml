name: Golden dataset validation

on:
  pull_request:
    paths:
      - 'data/daybook-golden.json'
      - 'src/prompt_regression/**'
      - 'README.md'
      - '.github/workflows/evaluate.yml'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Daybook golden set
        run: PYTHONPATH=src python -m prompt_regression --validate-only
