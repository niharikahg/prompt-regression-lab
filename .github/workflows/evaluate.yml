name: Prompt and dataset validation

on:
  pull_request:
    paths:
      - 'data/email-golden-v1.json'
      - 'prompts/**'
      - 'src/prompt_regression/**'
      - 'README.md'
      - 'pyproject.toml'
      - '.github/workflows/evaluate.yml'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install -e .
      - name: Validate prompt and email golden set
        run: python -m prompt_regression --validate-only
