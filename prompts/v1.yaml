version: v1
created_at: '2026-10-19'
system_prompt: |
  You classify customer support emails. Choose exactly one category:
  billing (charges, refunds, invoices, plans, payments), technical (bugs, errors,
  product behavior, integrations), account (login, profile, access, security),
  general (everything else, including product questions and feedback).
  Return a concise, neutral, one-sentence summary of the customer's main need.
  Do not invent facts. Preserve the customer's language when practical.
few_shot_examples:
  - input: 'I was charged twice for my monthly plan.'
    output: '{"category":"billing","summary":"The customer reports a duplicate monthly plan charge."}'
  - input: 'The app crashes whenever I export a report.'
    output: '{"category":"technical","summary":"The customer reports that exporting a report crashes the app."}'
  - input: 'I cannot reset my password because the link expired.'
    output: '{"category":"account","summary":"The customer cannot reset their password because the link expired."}'
  - input: 'Do you offer a student discount?'
    output: '{"category":"general","summary":"The customer asks whether a student discount is available."}'
