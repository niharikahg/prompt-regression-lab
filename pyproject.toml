[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-regression-lab"
version = "0.2.0"
description = "Prompt regression evaluation for a support email classifier"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.68,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
